name: Build AWG 2.0 for OpenWrt 25.12.5 mediatek/filogic

on:
  push:
    branches:
      - awg2-openwrt-25.12.5
    paths:
      - '.github/workflows/build-awg2-25.12.5-filogic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AWG 2.0 source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools zstd

      - name: Download OpenWrt 25.12.5 SDK for mediatek/filogic
        run: |
          set -euxo pipefail
          BASE='https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/'
          SDK_FILE=$(curl -fsSL "$BASE" | grep -o 'openwrt-sdk-25.12.5-mediatek-filogic_gcc-[^" ]*_musl[^" ]*\.Linux-x86_64\.tar\.[xzst]*' | head -n1)
          test -n "$SDK_FILE"
          wget -q "${BASE}${SDK_FILE}"
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf "$SDK_FILE" ;;
            *.tar.xz)  tar -xf "$SDK_FILE" ;;
            *) echo "Unsupported SDK archive: $SDK_FILE"; exit 1 ;;
          esac
          rm "$SDK_FILE"

      - name: Prepare SDK
        run: |
          set -euxo pipefail
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          test -n "$SDK_DIR"
          WORKSPACE_DIR="$PWD"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/
          cat > .config <<'EOF'
CONFIG_PACKAGE_kmod-amneziawg=m
CONFIG_PACKAGE_amneziawg-tools=y
CONFIG_PACKAGE_luci-proto-amneziawg=y
CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y
EOF
          make defconfig

      - name: Build packages
        run: |
          set -euxo pipefail
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          cd "$SDK_DIR"
          make package/luci-proto-amneziawg/compile V=s

      - name: Collect APKs
        run: |
          set -euxo pipefail
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          mkdir -p out
          find "$SDK_DIR/bin" -type f \( \
            -name 'kmod-amneziawg*.apk' -o \
            -name 'amneziawg-tools*.apk' -o \
            -name 'luci-proto-amneziawg*.apk' -o \
            -name 'luci-i18n-amneziawg-ru*.apk' \
          \) -exec cp -v {} out/ \;
          ls -lah out/
          test -n "$(find out -type f -name 'kmod-amneziawg*.apk' -print -quit)"
          test -n "$(find out -type f -name 'amneziawg-tools*.apk' -print -quit)"
          test -n "$(find out -type f -name 'luci-proto-amneziawg*.apk' -print -quit)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: awg2-openwrt-25.12.5-mediatek-filogic
          path: out/*.apk
          if-no-files-found: error
